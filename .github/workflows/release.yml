name: Release

# On every push to main: test, build the image, push it to the registry, and ask
# the infra repo to deploy it to staging. Production is promoted from the infra
# repo (Actions -> Deploy -> Run workflow), never from here.
# Each step is scripts/ci.sh; run it locally the same way.
#
# Settings (this repo):
#   vars.REGISTRY                        registry.digitalocean.com/<name>
#   vars.INFRA_REPO                      owner/repo of the infra repo (default forinda/forinda-tf-playground)
#   secrets.DIGITALOCEAN_REGISTRY_TOKEN  DigitalOcean token, scope registry: read/write
#   vars.DEPLOYER_CLIENT_ID              Client ID of the deployer GitHub App (installed on the infra repo only)
#   secrets.DEPLOYER_PRIVATE_KEY         its private key (.pem). Each run mints a 1-hour token that can only
#                                        write to the infra repo; nothing long-lived to expire or leak
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci.sh test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: push
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_TOKEN: ${{ secrets.DIGITALOCEAN_REGISTRY_TOKEN }}
        run: |
          tag=$(scripts/ci.sh image)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$REGISTRY/foter-ui:$tag\`." >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: image
    runs-on: ubuntu-latest
    env:
      INFRA_REPO: ${{ vars.INFRA_REPO || 'forinda/forinda-tf-playground' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: infra
        run: |
          [[ $INFRA_REPO =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "invalid INFRA_REPO '$INFRA_REPO'"; exit 1; }
          { echo "owner=${INFRA_REPO%/*}"; echo "name=${INFRA_REPO#*/}"; } >> "$GITHUB_OUTPUT"
      # A token for the infra repo only, Contents: write (what repository_dispatch needs), revoked after the job.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPLOYER_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          owner: ${{ steps.infra.outputs.owner }}
          repositories: ${{ steps.infra.outputs.name }}
          permission-contents: write
      - env:
          TAG: ${{ needs.image.outputs.tag }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          scripts/ci.sh deploy-staging
          echo "Requested staging deploy of foter-ui:$TAG in $INFRA_REPO." >> "$GITHUB_STEP_SUMMARY"
